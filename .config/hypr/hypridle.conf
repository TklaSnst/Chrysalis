# =============================================================================
# HYPRIDLE — что делать при простое
# Видео в браузере и игры держат idle-inhibit, во время них таймеры не идут.
# =============================================================================

general {
    # loginctl lock-session (Super+L, меню питания) приходит сюда
    lock_cmd = pidof hyprlock || hyprlock
    # перед сном — заблокировать, чтобы после пробуждения сразу был замок
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 5 мин — приглушить подсветку (на ноутбуках; на десктопе brightnessctl молча ничего не делает)
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 10 мин — блокировка
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 мин — погасить экраны
listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 30 мин — сон. Выключено: на десктопе мешает загрузкам и серверам.
# Раскомментируй, если нужно (например, на ноутбуке).
# listener {
#     timeout = 1800
#     on-timeout = systemctl suspend
# }
