# =============================================================================
# HYPRLAND NORD CONFIG (FIXED)
# =============================================================================

# Монитор (настройте под себя)
monitor=,preferred,auto,1

# Переменные
$term = alacritty
$menu = wofi --show drun
$mod = SUPER

# Цвета текущей темы (генерирует ~/.local/bin/theme-apply)
source = ~/.config/hypr/theme.conf

# Цветовая схема Nord (без градиентов)
$nord0 = rgb(2E3440)
$nord1 = rgb(3B4252)
$nord2 = rgb(434C5E)
$nord3 = rgb(4C566A)
$nord4 = rgb(D8DEE9)
$nord5 = rgb(E5E9F0)
$nord6 = rgb(ECEFF4)
$nord7 = rgb(8FBCBB)
$nord8 = rgb(88C0D0)
$nord9 = rgb(81A1C1)
$nord10 = rgb(5E81AC)
$nord11 = rgb(BF616A)
$nord12 = rgb(D08770)
$nord13 = rgb(EBCB8B)
$nord14 = rgb(A3BE8C)
$nord15 = rgb(B48EAD)

# Настройки внешнего вида (без градиентов)
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 2
    col.active_border = $accent
    col.inactive_border = $surface2
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 5

    # "Жидкое стекло": блюр под полупрозрачными слоями (wofi и т.п.)
    blur {
        enabled = true
        size = 5
        passes = 2
        noise = 0.02
        contrast = 1.1
        brightness = 1.05
        vibrancy = 0.45
        vibrancy_darkness = 0.25
        popups = true
        new_optimizations = true
    }
}

animations {
    enabled = true
    bezier = overshot, 0.13, 0.99, 0.29, 1.1
    bezier = bounce, 0.22, 1.55, 0.35, 1.0
    animation = windows, 1, 3, overshot, popin
    animation = border, 1, 3, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, default, slide
    animation = layers, 1, 4, bounce, popin 85%
    animation = layersIn, 1, 4, bounce, popin 85%
    animation = layersOut, 1, 3, overshot, popin 90%
    animation = fadeLayersIn, 1, 7, default
    animation = fadeLayersOut, 1, 5, default
}

# Смена обоев анимируется отдельным слоем (wallpaper-transition),
# поэтому сами swaybg и слой перехода появляются/исчезают мгновенно
layerrule {
    name = wallpaper-noanim
    match:namespace = ^(wallpaper|wallpaper-transition)$
    no_anim = on
}

# Speedtest из главного меню — плавающее окно по центру
windowrule {
    name = speedtest-float
    match:class = ^(speedtest)$
    float = on
    size = 680 300
    center = on
}

# Стекло для wofi
layerrule {
    name = wofi-glass
    match:namespace = wofi
    blur = on
    ignore_alpha = 0.05
    xray = 0
}

gesture = 3, horizontal, workspace
gesture = 3, down, mod: ALT, close
gesture = 3, up, mod: SUPER, scale: 1.5, fullscreen

# Отладка (включите логи)
debug {
    disable_logs = false
    enable_stdout_logs = true
}

# Раскладки клавиатуры
input {
    kb_layout = us,ru
    kb_options = grp:caps_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
    }
    sensitivity = 0
}

# Автозапуск
# Сначала отдаём окружение systemd/dbus и перезапускаем порталы: иначе
# xdg-desktop-portal-gtk стартует раньше Hyprland (его тянет spchr.service),
# не видит WAYLAND_DISPLAY, и тема (dark/light) не доходит до Firefox/Chromium
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user restart xdg-desktop-portal-gtk.service xdg-desktop-portal.service
exec-once = swaybg -m fill -i ~/.config/wallpapers/current
exec-once = ~/.local/bin/waybar-autostart
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Бинды приложений
bind = $mod, Return, exec, $term
bind = $mod SHIFT, Q, killactive,
bind = $mod, Space, exec, $menu
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, E, exit,

bind = $mod ALT, Space, exec, ~/.local/bin/wofi-main-menu

bind = $mod, B, exec, firefox
bind = $mod, C, exec, code
bind = $mod, V, exec, /opt/resolve/bin/resolve
bind = $mod, P, exec, grim -g "$(slurp)" - | wl-copy

# Полноэкранный режим и разметка
bind = $mod SHIFT, F11, fullscreen, 0
bind = $mod SHIFT, V, togglefloating,
bind = $mod SHIFT, P, togglegroup,
bind = $mod, J, togglesplit,

# Фокус и перемещение
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Рабочие пространства
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Scratchpad (аналог в Hyprland)
bind = $mod, S, togglespecialworkspace,
bind = $mod SHIFT, S, movetoworkspace, special

# Переключение рабочих пространств колесом мыши
bind = $mod, mouse_up, workspace, e+1
bind = $mod, mouse_down, workspace, e-1

# Режим изменения размера (аналог)
bind = $mod, R, submap, resize

submap = resize
binde = , left, resizeactive, -20 0
binde = , right, resizeactive, 20 0
binde = , up, resizeactive, 0 -20
binde = , down, resizeactive, 0 20
bind = , escape, submap, reset
bind = , return, submap, reset
submap = reset

# Медиа клавиши
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Скриншоты
bind = , Print, exec, grimshot save area
bind = CTRL, Print, exec, grimshot save output
bind = SHIFT, Print, exec, grimshot save screen

# Закрепление окон
bind = $mod SHIFT, X, pin,

# Настройки окружения
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
