# =============================================================================
# HYPRLOCK — экран блокировки (Super+L, а также hypridle по простою)
# Цвета — из theme.conf, его генерирует ~/.local/bin/theme-apply
# =============================================================================
source = ~/.config/hypr/theme.conf

$font = JetBrains Mono

general {
    hide_cursor = true
    # Enter по пустому полю не считается неудачной попыткой
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = overshot, 0.13, 0.99, 0.29, 1.1
    animation = fadeIn, 1, 4, default
    animation = fadeOut, 1, 4, default
    animation = inputFieldDots, 1, 2, default
    animation = inputFieldWidth, 1, 3, overshot
}

# Размытый снимок рабочего стола — блокировка выглядит как «стекло» поверх него
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    brightness = 0.6
    vibrancy = 0.2
}

# Часы
label {
    monitor =
    text = $TIME
    color = $fg_bright
    font_size = 96
    font_family = $font Bold
    position = 0, 160
    halign = center
    valign = center
}

# Дата
label {
    monitor =
    text = cmd[update:60000] date +'%d.%m.%Y'
    color = $fg_dim
    font_size = 18
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}

# Поле пароля
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 12
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $accent
    inner_color = $bg_glass
    font_color = $fg_bright
    font_family = $font
    check_color = $yellow
    fail_color = $red
    capslock_color = $orange
    fade_on_empty = false
    placeholder_text = <i>Пароль…</i>
    fail_text = <i>Неверно ($ATTEMPTS)</i>
    position = 0, -40
    halign = center
    valign = center
}

# Пользователь и раскладка
label {
    monitor =
    text =   $USER   ·   $LAYOUT
    color = $fg_dim
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -110
    halign = center
    valign = center
}
