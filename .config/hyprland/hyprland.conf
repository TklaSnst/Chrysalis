# =============================================================================
# betterdeb — Hyprland configuration
# Colors come from ~/.config/hyprland/theme.conf (generated by theme system)
# =============================================================================

source = ~/.config/hyprland/theme.conf

# ---------------------------------------------------------------------------
# Variables
# ---------------------------------------------------------------------------

$term    = kitty
$menu    = wofi --show drun
$browser = firefox
$editor  = code
$files   = thunar
$mod     = SUPER

# ---------------------------------------------------------------------------
# Monitor
# ---------------------------------------------------------------------------

monitor = , preferred, auto, 1

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------

env = XCURSOR_SIZE,         24
env = QT_QPA_PLATFORM,      wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = GDK_BACKEND,          wayland
env = XDG_CURRENT_DESKTOP,  Hyprland
env = XDG_SESSION_TYPE,     wayland
env = ELECTRON_OZONE_PLATFORM_HINT, wayland

# ---------------------------------------------------------------------------
# Startup
# ---------------------------------------------------------------------------

exec-once = swaybg -i ~/.config/wallpapers/current
exec-once = waybar
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hypridle

# ---------------------------------------------------------------------------
# General layout (colors overridden by theme.conf)
# ---------------------------------------------------------------------------

general {
    gaps_in         = 5
    gaps_out        = 10
    border_size     = 2
    resize_on_border = true
    layout          = dwindle
}

# ---------------------------------------------------------------------------
# Decorations & visual effects
# ---------------------------------------------------------------------------

decoration {
    rounding = 10

    blur {
        enabled          = true
        size             = 8
        passes           = 3
        vibrancy         = 0.17
        ignore_opacity   = true
    }

    shadow {
        enabled       = true
        range         = 20
        render_power  = 3
        # color set by theme.conf
    }

    dim_inactive  = true
    dim_strength  = 0.06
}

# ---------------------------------------------------------------------------
# Animations
# ---------------------------------------------------------------------------

animations {
    enabled = true

    bezier = ease,      0.25, 0.46, 0.45, 0.94
    bezier = easeOut,   0.00, 0.00, 0.20, 1.00
    bezier = easeInOut, 0.42, 0.00, 0.58, 1.00
    bezier = overshot,  0.05, 0.90, 0.10, 1.10
    bezier = spring,    0.22, 1.00, 0.36, 1.00

    animation = windows,      1, 4,  spring,  slide
    animation = windowsOut,   1, 3,  easeOut, slide
    animation = windowsMove,  1, 4,  ease
    animation = border,       1, 8,  ease
    animation = borderangle,  1, 35, ease,    loop
    animation = fade,         1, 5,  ease
    animation = workspaces,   1, 5,  easeInOut, slide
    animation = layers,       1, 3,  easeOut,   slide
}

# ---------------------------------------------------------------------------
# Input
# ---------------------------------------------------------------------------

input {
    kb_layout  = us,ru
    kb_options = grp:caps_toggle
    follow_mouse = 1
    sensitivity  = 0

    touchpad {
        natural_scroll    = true
        tap-to-click      = true
        disable_while_typing = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

# ---------------------------------------------------------------------------
# Layout
# ---------------------------------------------------------------------------

dwindle {
    pseudotile    = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper   = 0
    disable_hyprland_logo     = true
    always_follow_on_dnd      = true
    animate_manual_resizes    = true
    mouse_move_enables_dpms   = true
    key_press_enables_dpms    = true
}

# ---------------------------------------------------------------------------
# Window rules
# ---------------------------------------------------------------------------

windowrulev2 = float,       class:(pavucontrol)
windowrulev2 = float,       class:(blueman-manager)
windowrulev2 = float,       class:(nm-connection-editor)
windowrulev2 = float,       class:(nwg-look)
windowrulev2 = float,       class:(qt6ct)
windowrulev2 = float,       title:(File Operation Progress)
windowrulev2 = float,       title:(Confirm to replace files)
windowrulev2 = center,      class:(pavucontrol)
windowrulev2 = size 700 500, class:(pavucontrol)

# Picture-in-picture
windowrulev2 = float,         title:(Picture-in-Picture)
windowrulev2 = pin,           title:(Picture-in-Picture)
windowrulev2 = size 400 225,  title:(Picture-in-Picture)
windowrulev2 = move 100%-410 100%-235, title:(Picture-in-Picture)

# ---------------------------------------------------------------------------
# Layer rules (blur, etc.)
# ---------------------------------------------------------------------------

layerrule = blur,          waybar
layerrule = ignorezero,    waybar
layerrule = blur,          rofi
layerrule = ignorezero,    rofi
layerrule = blur,          wofi
layerrule = ignorezero,    wofi

# ---------------------------------------------------------------------------
# Keybindings — Applications
# ---------------------------------------------------------------------------

bind = $mod,       Return,    exec, $term
bind = $mod,       Space,     exec, $menu
bind = $mod,       B,         exec, $browser
bind = $mod,       E,         exec, $editor
bind = $mod,       F,         exec, $files

# Control plane (Super+Alt+Space)
bind = $mod ALT,   Space,     exec, ~/.config/rofi/menus/main.sh

# ---------------------------------------------------------------------------
# Keybindings — System
# ---------------------------------------------------------------------------

bind = $mod SHIFT, Q,         killactive,
bind = $mod SHIFT, E,         exit,
bind = $mod SHIFT, C,         exec, hyprctl reload
bind = $mod SHIFT, W,         exec, pkill -SIGUSR2 waybar || waybar &

# ---------------------------------------------------------------------------
# Keybindings — Screenshots (grim + slurp)
# ---------------------------------------------------------------------------

# Area → clipboard
bind = ,           Print,     exec, grim -g "$(slurp)" - | wl-copy
# Area → file
bind = SHIFT,      Print,     exec, grim -g "$(slurp)" ~/Pictures/screenshot_$(date +%Y%m%d_%H%M%S).png
# Full screen → clipboard
bind = CTRL,       Print,     exec, grim - | wl-copy
# Full screen → file
bind = CTRL SHIFT, Print,     exec, grim ~/Pictures/screenshot_$(date +%Y%m%d_%H%M%S).png

# Color picker
bind = $mod,       K,         exec, hyprpicker -a

# ---------------------------------------------------------------------------
# Keybindings — Window management
# ---------------------------------------------------------------------------

bind = $mod SHIFT, F,         togglefloating,
bind = $mod,       G,         togglegroup,
bind = $mod,       J,         togglesplit,
bind = $mod,       Tab,       cyclenext,
bind = $mod SHIFT, Tab,       cyclenext, prev
bind = $mod SHIFT, X,         pin,
bind = $mod,       M,         fullscreen, 1   # maximize
bind = $mod SHIFT, M,         fullscreen, 0   # true fullscreen

# Focus
bind = $mod,       left,      movefocus, l
bind = $mod,       right,     movefocus, r
bind = $mod,       up,        movefocus, u
bind = $mod,       down,      movefocus, d
bind = $mod,       H,         movefocus, l
bind = $mod,       L,         movefocus, r
bind = $mod,       K,         movefocus, u
# $mod+K is color picker, use $mod+J for down (already togglesplit)

# Move
bind = $mod SHIFT, left,      movewindow, l
bind = $mod SHIFT, right,     movewindow, r
bind = $mod SHIFT, up,        movewindow, u
bind = $mod SHIFT, down,      movewindow, d
bind = $mod SHIFT, H,         movewindow, l
bind = $mod SHIFT, L,         movewindow, r

# Scratchpad
bind = $mod,       S,         togglespecialworkspace,
bind = $mod SHIFT, S,         movetoworkspace, special

# Mouse scroll workspace
bind = $mod,       mouse_up,   workspace, e+1
bind = $mod,       mouse_down, workspace, e-1

# Mouse move/resize windows
bindm = $mod,      mouse:272,  movewindow
bindm = $mod,      mouse:273,  resizewindow

# ---------------------------------------------------------------------------
# Keybindings — Resize submap
# ---------------------------------------------------------------------------

bind = $mod,       R,          submap, resize

submap = resize
binde = ,          left,       resizeactive, -20 0
binde = ,          right,      resizeactive,  20 0
binde = ,          up,         resizeactive,  0 -20
binde = ,          down,       resizeactive,  0  20
binde = ,          H,          resizeactive, -20 0
binde = ,          L,          resizeactive,  20 0
binde = ,          K,          resizeactive,  0 -20
binde = ,          J,          resizeactive,  0  20
bind  = ,          escape,     submap, reset
bind  = ,          return,     submap, reset
submap = reset

# ---------------------------------------------------------------------------
# Keybindings — Workspaces
# ---------------------------------------------------------------------------

bind = $mod,       1, workspace, 1
bind = $mod,       2, workspace, 2
bind = $mod,       3, workspace, 3
bind = $mod,       4, workspace, 4
bind = $mod,       5, workspace, 5
bind = $mod,       6, workspace, 6
bind = $mod,       7, workspace, 7
bind = $mod,       8, workspace, 8
bind = $mod,       9, workspace, 9
bind = $mod,       0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# ---------------------------------------------------------------------------
# Keybindings — Media
# ---------------------------------------------------------------------------

bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind   = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind   = , XF86AudioPlay,         exec, playerctl play-pause
bind   = , XF86AudioNext,         exec, playerctl next
bind   = , XF86AudioPrev,         exec, playerctl previous

bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
